name: Refresh YouTube data

# Updates data/youtube.js (subscribers, video count, latest videos and views) once a day.
# Optional: add a repository secret YOUTUBE_API_KEY for exact subscriber/total-view counts.
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST every day
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: youtube-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch channel data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update-youtube.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/youtube.js; then echo "No change"; exit 0; fi
          git config user.name "zerowealth-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.js
          git commit -m "Refresh YouTube data"
          git push
